<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" width="920" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Two spaces, four principles</title>
  <desc id="desc">A grid with two columns and four rows. Column 1, how you choose and use AI. Column 2, what you produce with AI. Trustworthy: know where your code and data go, check the code and the packages it adds, keep secrets out of your prompts; the output is secure and tested. Non-discriminatory: use test data without bias such as names, genders and languages; the output is accessible to all people. Eco-friendly: choose a model of the right size for the task; the output is light in code, data and energy. At the service of people: keep personal data out of prompts, limit what an agent can do, decide yourself on risky actions; the output respects privacy and has no manipulation.</desc>
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2328; }
    .muted { fill: #59636e; }
    .head { fill: #eef2f6; stroke: #d1d9e0; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; }
    .trust { fill: #0969da; }
    .fair { fill: #8250df; }
    .eco { fill: #1a7f37; }
    .human { fill: #bc4c00; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .h1 { font-size: 22px; font-weight: 700; }
    .h2 { font-size: 17px; font-weight: 700; }
    .p { font-size: 16px; font-weight: 700; }
    .q { font-size: 13.5px; font-style: italic; }
    .t { font-size: 14.5px; }
    .sub { font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .head { fill: #1c2128; stroke: #3d444d; }
      .card { fill: #151b23; stroke: #3d444d; }
      .trust { fill: #4493f8; }
      .fair { fill: #ab7df8; }
      .eco { fill: #3fb950; }
      .human { fill: #db6d28; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="920" height="640" rx="16"/>

  <text class="h1 ink" x="20" y="44">Two spaces, four principles</text>

  <!-- Column headers -->
  <rect class="head" x="210" y="70" width="340" height="80" rx="10"/>
  <text class="h2 ink" x="230" y="104">1 · How you choose and use AI</text>
  <text class="sub muted" x="230" y="128">The way you work with the assistant</text>

  <rect class="head" x="560" y="70" width="340" height="80" rx="10"/>
  <text class="h2 ink" x="580" y="104">2 · What you produce</text>
  <text class="sub muted" x="580" y="128">The code and products you make with AI</text>

  <!-- Row 1: Trustworthy -->
  <rect class="trust" x="20" y="165" width="6" height="105" rx="3"/>
  <text class="p trust" x="38" y="211">Trustworthy</text>
  <text class="q muted" x="38" y="235">Can I check it?</text>

  <rect class="card" x="210" y="165" width="340" height="105" rx="10"/>
  <circle class="trust" cx="232" cy="190" r="3.5"/>
  <text class="t ink" x="244" y="195">Know where your code and data go</text>
  <circle class="trust" cx="232" cy="214" r="3.5"/>
  <text class="t ink" x="244" y="219">Check the code and packages it adds</text>
  <circle class="trust" cx="232" cy="238" r="3.5"/>
  <text class="t ink" x="244" y="243">Keep secrets out of your prompts</text>

  <rect class="card" x="560" y="165" width="340" height="105" rx="10"/>
  <circle class="trust" cx="582" cy="214" r="3.5"/>
  <text class="t ink" x="594" y="219">Secure and tested</text>

  <!-- Row 2: Non-discriminatory -->
  <rect class="fair" x="20" y="280" width="6" height="105" rx="3"/>
  <text class="p fair" x="38" y="326">Non-discriminatory</text>
  <text class="q muted" x="38" y="350">Who is left out?</text>

  <rect class="card" x="210" y="280" width="340" height="105" rx="10"/>
  <circle class="fair" cx="232" cy="317" r="3.5"/>
  <text class="t ink" x="244" y="322">Use test data without bias</text>
  <text class="t muted" x="244" y="346">names, genders, languages</text>

  <rect class="card" x="560" y="280" width="340" height="105" rx="10"/>
  <circle class="fair" cx="582" cy="329" r="3.5"/>
  <text class="t ink" x="594" y="334">Accessible to all people</text>

  <!-- Row 3: Eco-friendly -->
  <rect class="eco" x="20" y="395" width="6" height="105" rx="3"/>
  <text class="p eco" x="38" y="441">Eco-friendly</text>
  <text class="q muted" x="38" y="465">Is it necessary?</text>

  <rect class="card" x="210" y="395" width="340" height="105" rx="10"/>
  <circle class="eco" cx="232" cy="432" r="3.5"/>
  <text class="t ink" x="244" y="437">Choose a model of the right size</text>
  <text class="t muted" x="244" y="461">for the task</text>

  <rect class="card" x="560" y="395" width="340" height="105" rx="10"/>
  <circle class="eco" cx="582" cy="444" r="3.5"/>
  <text class="t ink" x="594" y="449">Light in code, data and energy</text>

  <!-- Row 4: At the service of people -->
  <rect class="human" x="20" y="510" width="6" height="105" rx="3"/>
  <text class="p human" x="38" y="545">At the service</text>
  <text class="p human" x="38" y="566">of people</text>
  <text class="q muted" x="38" y="590">Who decides?</text>

  <rect class="card" x="210" y="510" width="340" height="105" rx="10"/>
  <circle class="human" cx="232" cy="535" r="3.5"/>
  <text class="t ink" x="244" y="540">Keep personal data out of prompts</text>
  <circle class="human" cx="232" cy="559" r="3.5"/>
  <text class="t ink" x="244" y="564">Limit what an agent can do</text>
  <circle class="human" cx="232" cy="583" r="3.5"/>
  <text class="t ink" x="244" y="588">Decide yourself on risky actions</text>

  <rect class="card" x="560" y="510" width="340" height="105" rx="10"/>
  <circle class="human" cx="582" cy="547" r="3.5"/>
  <text class="t ink" x="594" y="552">Respects privacy</text>
  <circle class="human" cx="582" cy="571" r="3.5"/>
  <text class="t ink" x="594" y="576">No manipulation</text>
</svg>
