<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" role="img" aria-labelledby="t d">
  <title id="t">Enter saves the model. The s key does not.</title>
  <desc id="d">Two rows. In the first row, you press Enter in the /model picker, or type /model with a model name. The session uses the model, and the choice is saved as the default in your user settings, so new sessions start on it. In the second row, you press s in the picker. The session uses the model, and the saved default stays unchanged.</desc>
  <style>
    :root {
      --text: #ececea; --muted: #a3a39d;
      --inp-fill: #4a4a47; --inp-stroke: #6a6a65;
      --earl-fill: #2f5a44; --earl-stroke: #4cc38a;
      --out-fill: #4cc38a; --out-stroke: #7bdcae; --out-text: #0f2a1d;
      --noise-fill: #d9a043; --noise-stroke: #e0a850;
      --cache-fill: #2b4466; --cache-stroke: #7fb0ea;
      --frame: #8d8a82;
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .title { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .row { font-size: 14px; font-weight: 600; }
    .label { font-size: 13px; }
    .small { font-size: 11px; }
    .inblock { font-size: 12px; text-anchor: middle; }
    .muted { fill: var(--muted); }
    .right { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1.5; }
    .dashed { fill: none; stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .inp { fill: var(--inp-fill); stroke: var(--inp-stroke); stroke-width: 1.5; }
    .earl { fill: var(--earl-fill); stroke: var(--earl-stroke); stroke-width: 1.5; }
    .out { fill: var(--out-fill); stroke: var(--out-stroke); stroke-width: 2; }
    .outtext { fill: var(--out-text); font-weight: 600; }
    .noise { fill: var(--noise-fill); stroke: var(--noise-stroke); stroke-width: 1.5; }
    .noisetext { fill: #1a1a1a; }
    .cache { fill: var(--cache-fill); stroke: var(--cache-stroke); stroke-width: 1.5; }
    .cacheline { stroke: var(--cache-stroke); stroke-width: 3; fill: none; stroke-linecap: round; }
    .drop { fill: none; stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .droptext { fill: var(--muted); }
    .arrow { stroke: var(--frame); stroke-width: 1.5; fill: none; }
    .arrowhead { fill: var(--frame); }
  </style>

  <text class="title" x="360" y="30">Enter saves the model. The s key does not.</text>
  <text class="row" x="40" y="62">Enter in the /model picker, or /model name</text>
  <rect class="out" x="40" y="74" width="200" height="40" rx="4"/>
  <text class="inblock outtext" x="140" y="98">This session uses the model</text>
  <rect class="earl" x="300" y="74" width="380" height="40" rx="4"/>
  <text class="inblock " x="490" y="98">Saved as default in user settings</text>
  <path class="arrow" d="M 240 94 L 292 94"/>
  <path class="arrowhead" d="M 291 88 L 300 94 L 291 100 Z"/>
  <text class="label muted" x="300" y="134">New sessions start on this model</text>
  <text class="row" x="40" y="172">s in the /model picker</text>
  <rect class="out" x="40" y="184" width="200" height="40" rx="4"/>
  <text class="inblock outtext" x="140" y="208">This session uses the model</text>
  <rect class="drop" x="300" y="184" width="380" height="40" rx="4"/>
  <text class="inblock droptext" x="490" y="208">Saved default: unchanged</text>
  <text class="label muted" x="300" y="244">New sessions start on the model you had saved before</text>
  <text class="label muted" x="40" y="290">Behaviour from the Claude Code docs, not measured data.</text>
</svg>
