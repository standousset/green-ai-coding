<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" width="720" height="294" role="img" aria-labelledby="t d">
  <title id="t">A fresh start is shorter than a third correction</title>
  <desc id="d">Two horizontal bars, each in a frame. The first bar is the request after a third correction. It holds your request, three failed replies and three fixes as input, and a new reply 4 as output. The second bar is the request after /clear with a better prompt. It holds only the better prompt as input and a new reply as output. The second bar is much shorter. The sizes are illustrative, not measured.</desc>
  <style>
    :root {
      --text: #2b2b2b; --muted: #6b6b66;
      --inp-fill: #dcd9d2; --inp-stroke: #b9b5ab;
      --earl-fill: #cfe8da; --earl-stroke: #5aa07f;
      --out-fill: #1f7a50; --out-stroke: #165c3b; --out-text: #ffffff;
      --noise-fill: #f0b04a; --noise-stroke: #a8731a;
      --cache-fill: #d6e4f5; --cache-stroke: #4d78b3;
      --frame: #8d8a82;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #ececea; --muted: #a3a39d;
        --inp-fill: #4a4a47; --inp-stroke: #6a6a65;
        --earl-fill: #2f5a44; --earl-stroke: #4cc38a;
        --out-fill: #4cc38a; --out-stroke: #7bdcae; --out-text: #0f2a1d;
        --noise-fill: #d9a043; --noise-stroke: #e0a850;
        --cache-fill: #2b4466; --cache-stroke: #7fb0ea;
        --frame: #8d8a82;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .title { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .row { font-size: 14px; font-weight: 600; }
    .label { font-size: 13px; }
    .small { font-size: 11px; }
    .inblock { font-size: 12px; text-anchor: middle; }
    .muted { fill: var(--muted); }
    .right { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1.5; }
    .dashed { fill: none; stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .inp { fill: var(--inp-fill); stroke: var(--inp-stroke); stroke-width: 1.5; }
    .earl { fill: var(--earl-fill); stroke: var(--earl-stroke); stroke-width: 1.5; }
    .out { fill: var(--out-fill); stroke: var(--out-stroke); stroke-width: 2; }
    .outtext { fill: var(--out-text); font-weight: 600; }
    .noise { fill: var(--noise-fill); stroke: var(--noise-stroke); stroke-width: 1.5; }
    .noisetext { fill: #1a1a1a; }
    .cache { fill: var(--cache-fill); stroke: var(--cache-stroke); stroke-width: 1.5; }
    .cacheline { stroke: var(--cache-stroke); stroke-width: 3; fill: none; stroke-linecap: round; }
    .drop { fill: none; stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .droptext { fill: var(--muted); }
    .arrow { stroke: var(--frame); stroke-width: 1.5; fill: none; }
    .arrowhead { fill: var(--frame); }
  </style>

  <text class="title" x="360" y="30">A fresh start is shorter than a third correction</text>
  <text class="row" x="40" y="66">Third correction</text>
  <rect class="frame" x="40" y="76" width="640" height="50" rx="6"/>
  <rect class="inp" x="44" y="81" width="80" height="40" rx="4"/>
  <text class="inblock " x="84" y="105">request</text>
  <rect class="earl" x="128" y="81" width="66" height="40" rx="4"/>
  <text class="inblock " x="161" y="105">reply 1</text>
  <rect class="inp" x="198" y="81" width="56" height="40" rx="4"/>
  <text class="inblock " x="226" y="105">fix 1</text>
  <rect class="earl" x="258" y="81" width="66" height="40" rx="4"/>
  <text class="inblock " x="291" y="105">reply 2</text>
  <rect class="inp" x="328" y="81" width="56" height="40" rx="4"/>
  <text class="inblock " x="356" y="105">fix 2</text>
  <rect class="earl" x="388" y="81" width="66" height="40" rx="4"/>
  <text class="inblock " x="421" y="105">reply 3</text>
  <rect class="inp" x="458" y="81" width="56" height="40" rx="4"/>
  <text class="inblock " x="486" y="105">fix 3</text>
  <rect class="out" x="518" y="81" width="66" height="40" rx="4"/>
  <text class="inblock outtext" x="551" y="105">reply 4</text>
  <text class="row" x="40" y="150">/clear and a better prompt</text>
  <rect class="frame" x="40" y="160" width="640" height="50" rx="6"/>
  <rect class="inp" x="44" y="165" width="150" height="40" rx="4"/>
  <text class="inblock " x="119" y="189">better prompt</text>
  <rect class="out" x="198" y="165" width="66" height="40" rx="4"/>
  <text class="inblock outtext" x="231" y="189">reply</text>
  <rect class="inp" x="40" y="236" width="16" height="16" rx="3"/>
  <text class="label" x="64" y="249">Input: your message</text>
  <rect class="earl" x="254" y="236" width="16" height="16" rx="3"/>
  <text class="label" x="278" y="249">Earlier reply, now input</text>
  <rect class="out" x="488" y="236" width="16" height="16" rx="3"/>
  <text class="label" x="512" y="249">Output: new reply</text>
  <text class="label muted" x="40" y="270" text-anchor="start">The better prompt holds what you learned from the failed tries. Sizes are illustrative, not measured.</text>
</svg>
