<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="720" height="318" role="img" aria-labelledby="t d">
  <title id="t">More thinking means more output tokens</title>
  <desc id="d">Two horizontal bars, each in a frame. At a low effort level, the bar holds your input, a short thinking part and the answer. At a high effort level, the bar holds your input, a much longer thinking part and an answer of the same size. The thinking and the answer are both output tokens. The sizes are illustrative, not measured.</desc>
  <style>
    :root {
      --text: #ececea; --muted: #a3a39d;
      --inp-fill: #4a4a47; --inp-stroke: #6a6a65;
      --earl-fill: #2f5a44; --earl-stroke: #4cc38a;
      --out-fill: #4cc38a; --out-stroke: #7bdcae; --out-text: #0f2a1d;
      --noise-fill: #d9a043; --noise-stroke: #e0a850;
      --cache-fill: #2b4466; --cache-stroke: #7fb0ea;
      --frame: #8d8a82;
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .title { font-size: 18px; font-weight: 600; text-anchor: middle; }
    .row { font-size: 14px; font-weight: 600; }
    .label { font-size: 13px; }
    .small { font-size: 11px; }
    .inblock { font-size: 12px; text-anchor: middle; }
    .muted { fill: var(--muted); }
    .right { text-anchor: end; }
    .mid { text-anchor: middle; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1.5; }
    .dashed { fill: none; stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .inp { fill: var(--inp-fill); stroke: var(--inp-stroke); stroke-width: 1.5; }
    .earl { fill: var(--earl-fill); stroke: var(--earl-stroke); stroke-width: 1.5; }
    .out { fill: var(--out-fill); stroke: var(--out-stroke); stroke-width: 2; }
    .outtext { fill: var(--out-text); font-weight: 600; }
    .noise { fill: var(--noise-fill); stroke: var(--noise-stroke); stroke-width: 1.5; }
    .noisetext { fill: #1a1a1a; }
    .cache { fill: var(--cache-fill); stroke: var(--cache-stroke); stroke-width: 1.5; }
    .cacheline { stroke: var(--cache-stroke); stroke-width: 3; fill: none; stroke-linecap: round; }
    .drop { fill: none; stroke: var(--frame); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .droptext { fill: var(--muted); }
    .arrow { stroke: var(--frame); stroke-width: 1.5; fill: none; }
    .arrowhead { fill: var(--frame); }
  </style>

  <text class="title" x="360" y="30">More thinking means more output tokens</text>
  <text class="row" x="40" y="66">Low effort</text>
  <rect class="frame" x="40" y="76" width="640" height="50" rx="6"/>
  <rect class="inp" x="44" y="81" width="110" height="40" rx="4"/>
  <text class="inblock " x="99" y="105">your input</text>
  <rect class="out" x="158" y="81" width="70" height="40" rx="4"/>
  <text class="inblock outtext" x="193" y="105">thinking</text>
  <rect class="out" x="232" y="81" width="100" height="40" rx="4"/>
  <text class="inblock outtext" x="282" y="105">answer</text>
  <text class="row" x="40" y="160">High effort</text>
  <rect class="frame" x="40" y="170" width="640" height="50" rx="6"/>
  <rect class="inp" x="44" y="175" width="110" height="40" rx="4"/>
  <text class="inblock " x="99" y="199">your input</text>
  <rect class="out" x="158" y="175" width="330" height="40" rx="4"/>
  <text class="inblock outtext" x="323" y="199">thinking</text>
  <rect class="out" x="492" y="175" width="100" height="40" rx="4"/>
  <text class="inblock outtext" x="542" y="199">answer</text>
  <rect class="inp" x="40" y="256" width="16" height="16" rx="3"/>
  <text class="label" x="64" y="269">Input: your request</text>
  <rect class="out" x="234" y="256" width="16" height="16" rx="3"/>
  <text class="label" x="258" y="269">Output: thinking and answer</text>
  <text class="label muted" x="40" y="290" text-anchor="start">Both parts of the output are tokens that the model writes. Sizes are illustrative, not measured.</text>
</svg>
